[project]
name = "fiction-companion-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["elevenlabs>=2.78.0", "python-dotenv>=1.0", "ebooklib>=0.21", "beautifulsoup4>=4.12", "httpx>=0.27",
                "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Adaption Labs API (run with -m live)"]
addopts = "-m 'not live'"
