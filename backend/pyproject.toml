[project]
name = "fiction-companion-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ebooklib>=0.21", "beautifulsoup4>=4.12", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Adaption Labs API (run with -m live)"]
addopts = "-m 'not live'"
